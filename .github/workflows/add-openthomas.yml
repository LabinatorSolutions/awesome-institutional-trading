name: Add OpenThomas entry

on:
  push:
    branches:
      - add-openthomas

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-openthomas
          fetch-depth: 0
      - name: Add OpenThomas to systematic trading
        shell: python
        run: |
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text()
          entry = "| [OpenThomas](https://github.com/PredictionMarketTrader/openthomas) | Python | Open-source autonomous prediction-market trading agent with leak-free hindcasts, forecast calibration, fractional Kelly sizing, and paper-first execution for Kalshi and Polymarket. |"
          needle = "| [Backtrader](https://www.backtrader.com/) | Python | The most widely used open-source Python backtesting framework. Excellent for prototyping systematic strategies. |"
          if entry not in text:
              if needle not in text:
                  raise SystemExit("Expected Backtrader entry not found")
              text = text.replace(needle, needle + "\n" + entry, 1)
              path.write_text(text)
      - name: Commit clean README-only change
        run: |
          git config user.name "pachutanco"
          git config user.email "325010933+pachutanco@users.noreply.github.com"
          git rm .github/workflows/add-openthomas.yml
          git add README.md
          git commit -m "Add OpenThomas to systematic trading"
          git push origin add-openthomas
